<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Checklist Fibonacci Engenharia</title>
<style>
  :root{
    --gold: #C9A227;
    --gold-light: #E6C34D;
    --black: #0A0A0A;

    /* tema claro (padrão) */
    --bg: #F4F3EF;
    --header-bg: #FFFFFF;
    --header-border: #E1DFD6;
    --header-text: #9A7A1E;
    --header-text-secondary: #8A8878;
    --header-btn-border: #D8D6CC;
    --header-btn-text: #9A7A1E;
    --header-btn-hover-bg: #F4F3EF;
    --header-track-bg: #E1DFD6;
    --card: #FFFFFF;
    --card-alt: #FAF9F5;
    --border: #E1DFD6;
    --text: #1D1C1A;
    --text-secondary: #6B6A62;
    --sidebar-bg: #FFFFFF;
    --sidebar-border: #E1DFD6;
    --sidebar-text: #6B6A62;
    --sidebar-text-hover: #1D1C1A;
    --sidebar-hover-bg: #FAF9F5;
    --sidebar-active-bg: #FAF6E9;
    --sidebar-active-text: #0A0A0A;
    --sidebar-count: #8A8878;
    --chip-bg: #FAF6E9;
    --chip-border: #EEE0B8;
    --track-bg: #EAE8DE;
  }
  body.theme-dark{
    --bg: #121210;
    --header-bg: #0A0A0A;
    --header-border: #0A0A0A;
    --header-text: #E6C34D;
    --header-text-secondary: #C9C7BC;
    --header-btn-border: #4A4A46;
    --header-btn-text: #E6C34D;
    --header-btn-hover-bg: #1A1A18;
    --header-track-bg: #2A2A28;
    --card: #1C1B18;
    --card-alt: #242320;
    --border: #33322D;
    --text: #EDEBE3;
    --text-secondary: #9C9A90;
    --sidebar-bg: #0A0A0A;
    --sidebar-border: #0A0A0A;
    --sidebar-text: #C9C7BC;
    --sidebar-text-hover: #E6E4DC;
    --sidebar-hover-bg: #1A1A18;
    --sidebar-active-bg: #2A2117;
    --sidebar-active-text: #E6C34D;
    --sidebar-count: #6B6A62;
    --chip-bg: #2A2117;
    --chip-border: #4A3B1E;
    --track-bg: #2A2A28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background-color .15s ease, color .15s ease;
  }
  .wrap{max-width:1300px;margin:0 auto;padding:0;}

  header{
    background: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
    padding: 24px 28px 22px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .logo-badge{
    background:#fff;
    border-radius:10px;
    padding:8px 14px;
    display:flex;
    align-items:center;
    flex-shrink:0;
  }
  .logo-badge img{height:36px;display:block;}
  .header-text{flex:1;min-width:220px;}
  .header-text h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    color: var(--header-text);
    letter-spacing:0.5px;
  }
  .header-text p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--header-text-secondary);
  }
  .header-progress{min-width:180px;}
  .header-progress .label{
    font-size:12px;color:var(--header-text-secondary);margin-bottom:6px;display:flex;justify-content:space-between;
  }
  .header-progress .label b{color:var(--header-text);font-weight:700;}
  .track{
    height:8px;border-radius:4px;background:var(--header-track-bg);overflow:hidden;
  }
  .fill{
    height:100%;background:var(--gold);border-radius:4px;transition:width .25s ease;
  }
  .print-btn{
    background:transparent;border:1px solid var(--header-btn-border);color:var(--header-btn-text);
    padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .print-btn:hover{background:var(--header-btn-hover-bg);}
  .theme-toggle-btn{
    background:transparent;border:1px solid var(--header-btn-border);color:var(--header-btn-text);
    width:38px;height:38px;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .theme-toggle-btn:hover{background:var(--header-btn-hover-bg);}
  .theme-toggle-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}
  .theme-toggle-btn .icon-sun{display:none;}
  body.theme-dark .theme-toggle-btn .icon-moon{display:none;}
  body.theme-dark .theme-toggle-btn .icon-sun{display:block;}

  .layout{
    display:flex;
    align-items:flex-start;
  }

  .sidebar{
    flex:0 0 260px;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-border);
    min-height:100%;
    padding:16px 10px;
  }
  .new-sala-btn{
    margin:16px 4px 4px;
    padding:10px 10px;font-size:12.5px;font-weight:700;
    background:transparent;border:1px dashed var(--gold);color:var(--gold);
    border-radius:8px;cursor:pointer;text-align:center;width:calc(100% - 8px);
  }
  .new-sala-btn:hover{background:var(--sidebar-hover-bg);}

  .nav-section{margin-bottom:2px;}
  .nav-btn{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:11px 12px;font-size:13.5px;font-weight:700;color:var(--sidebar-text);
    background:transparent;border:none;border-radius:10px;cursor:pointer;text-align:left;
  }
  .nav-btn:hover{background:var(--sidebar-hover-bg);}
  .nav-btn.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);}
  .nav-btn .nav-icon{
    flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  }
  .nav-btn .nav-icon svg{width:18px;height:18px;stroke:currentColor;}
  .nav-btn .nav-label{flex:1;}
  .nav-btn .nav-arrow{
    font-size:9px;color:var(--sidebar-count);transition:transform .15s ease;flex-shrink:0;
  }
  .nav-btn.expanded .nav-arrow{transform:rotate(90deg);color:var(--sidebar-active-text);}
  .nav-sublist{
    display:none;flex-direction:column;gap:2px;padding:2px 2px 10px 30px;
  }
  .nav-sublist.expanded{display:flex;}

  .add-task-btn{
    display:inline-flex;align-items:center;gap:6px;
    margin-bottom:14px;padding:9px 14px;font-size:13px;font-weight:700;
    background:var(--gold);border:none;color:#fff;border-radius:8px;cursor:pointer;
  }
  .add-task-btn:hover{background:var(--gold-light);}

  .archive-btn{
    display:inline-flex;align-items:center;gap:6px;
    margin-bottom:14px;margin-left:10px;padding:9px 14px;font-size:13px;font-weight:700;
    background:transparent;border:1px solid var(--border);color:var(--text-secondary);
    border-radius:8px;cursor:pointer;
  }
  .archive-btn:hover{border-color:var(--gold);color:var(--gold);}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(10,10,10,0.5);
    align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:var(--card);border-radius:12px;max-width:420px;width:100%;
    padding:22px;box-shadow:0 12px 40px rgba(0,0,0,0.25);
  }
  .modal-card h3{margin:0 0 16px;font-size:16px;font-weight:700;color:var(--text);}
  .modal-field{margin-bottom:14px;}
  .modal-field label{
    display:block;font-size:12px;font-weight:700;color:var(--text-secondary);
    margin-bottom:5px;
  }
  .modal-field input[type="text"], .modal-field select{
    width:100%;padding:9px 10px;font-size:14px;border:1px solid var(--border);
    border-radius:6px;font-family:inherit;box-sizing:border-box;background:var(--card);color:var(--text);
  }
  .modal-days{display:flex;flex-wrap:wrap;gap:6px;}
  .modal-day-chip{
    font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--card);color:var(--text-secondary);cursor:pointer;
  }
  .modal-day-chip.active{background:var(--gold);border-color:var(--gold);color:#fff;}
  .modal-hint{font-size:11.5px;color:var(--text-secondary);margin-top:6px;}

  .quick-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:var(--bg);
  }
  .quick-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:28px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,0.10);
  }
  .quick-logo{display:flex;justify-content:center;margin-bottom:16px;}
  .quick-logo img{height:44px;}
  .quick-card h1{font-size:19px;margin:0 0 18px;text-align:center;color:var(--text);}
  .quick-sub{font-size:13px;color:var(--text-secondary);margin:0 0 16px;text-align:center;}
  .quick-hint{font-size:11.5px;color:var(--text-secondary);margin:6px 0 4px;}
  .quick-btn{
    width:100%;padding:12px;font-size:14px;font-weight:700;border-radius:8px;
    border:none;background:var(--gold);color:#fff;cursor:pointer;margin-top:8px;
  }
  .quick-btn:hover{background:var(--gold-light);}
  .quick-btn:disabled{opacity:0.6;cursor:default;}
  .quick-success{
    color:#1a7a3c;font-size:13px;margin-top:10px;display:none;font-weight:700;text-align:center;
  }
  .quick-success.show{display:block;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .modal-btn{
    padding:9px 16px;font-size:13px;font-weight:700;border-radius:7px;cursor:pointer;border:none;
  }
  .modal-btn-cancel{background:var(--card-alt);color:var(--text);}
  .modal-btn-danger{background:transparent;color:#C0392B;border:1px solid #E0A8A0;}
  .modal-btn-danger:hover{background:#FCEBEA;}
  .modal-btn-confirm{background:var(--gold);color:#fff;}
  .modal-btn-confirm:hover{background:var(--gold-light);}
  .modal-error{color:#E5484D;font-size:12px;margin-top:8px;display:none;}
  .modal-error.show{display:block;}

  .tab{
    padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--sidebar-text);
    background:transparent;border:none;border-left:2px solid transparent;border-radius:6px;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    text-align:left;
    line-height:1.25;
  }
  .tab span:first-child{white-space:normal;word-break:break-word;}
  .tab:hover{background:var(--sidebar-hover-bg);color:var(--sidebar-text-hover);}
  .tab.active{color:var(--sidebar-active-text);border-left:2px solid var(--gold);background:var(--sidebar-active-bg);}
  .tab .count{
    display:inline-block;font-size:10.5px;font-weight:700;
    color:var(--sidebar-count);
  }
  .tab-empty{
    padding:8px 10px;font-size:11.5px;color:var(--sidebar-count);font-style:italic;
  }

  main{flex:1;min-width:0;padding:20px 24px 40px;}
  .employee-name{
    font-size:20px;font-weight:700;color:var(--text);margin:4px 0 14px;
  }
  .employee-progress{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .employee-progress .track{flex:1;background:var(--track-bg);height:8px;}
  .employee-progress .fill{background:var(--gold);}
  .employee-progress .pct{font-size:13px;font-weight:700;color:var(--text);min-width:70px;text-align:right;}

  .sala-board{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .sala-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;
    flex:1 1 250px;
    max-width:320px;
  }
  .sala-head{
    padding:12px 16px;background:var(--card-alt);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
  }
  .sala-head h3{margin:0;font-size:14px;font-weight:700;color:var(--text);}
  .sala-head .sala-count{font-size:12px;color:var(--text-secondary);}
  .task-list{list-style:none;margin:0;padding:6px 8px;}
  .task-item{
    display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:6px;
  }
  .task-item:hover{background:var(--card-alt);}
  .task-item input{
    margin-top:2px;width:16px;height:16px;accent-color:var(--gold);flex-shrink:0;cursor:pointer;
  }
  .task-item-body{flex:1;min-width:0;}
  .task-item label{font-size:14px;line-height:1.4;cursor:pointer;display:block;color:var(--text);}
  .task-item.done label{color:var(--text-secondary);text-decoration:line-through;}

  .task-item-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .task-item-row label{flex:1;}
  .edit-task-btn{
    flex-shrink:0;background:none;border:none;color:var(--text-secondary);
    cursor:pointer;padding:2px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  }
  .edit-task-btn:hover{color:var(--gold);background:var(--card-alt);}
  .edit-task-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}

  .day-pills{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .day-pill{
    font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
    border:1px solid var(--border);background:var(--card);color:var(--text-secondary);
    cursor:pointer;line-height:1.4;
  }
  .day-pill:hover{border-color:var(--gold);}
  .day-pill.active{background:var(--gold);border-color:var(--gold);color:#fff;}

  .calendar-section{margin-top:28px;}
  .calendar-section h2{
    font-size:16px;font-weight:700;margin:0 0 12px;color:var(--text);
  }
  .calendar-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .calendar-day{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    min-height:70px;overflow:hidden;
    flex:1 1 140px;
    max-width:220px;
  }
  .calendar-day-head{
    padding:8px 10px;background:var(--card-alt);border-bottom:1px solid var(--border);
    font-size:12px;font-weight:700;color:var(--text);
  }
  .calendar-day-body{padding:6px;display:flex;flex-direction:column;gap:5px;}
  .calendar-chip{
    background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:6px;
    padding:5px 7px;font-size:11.5px;line-height:1.3;color:var(--text);
  }
  .calendar-chip.done{opacity:0.55;text-decoration:line-through;}
  .calendar-chip .chip-context{
    display:block;font-size:9.5px;font-weight:700;color:var(--text-secondary);
    text-transform:uppercase;letter-spacing:0.3px;margin-bottom:2px;
  }
  .calendar-day-empty{padding:10px;font-size:11px;color:var(--text-secondary);text-align:center;}

  @media (max-width: 780px){
    .calendar-day{flex-basis:110px;}
  }

  .empty{
    text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px;
  }

  .task-list-empty{
    padding:14px 8px;font-size:13px;color:var(--text-secondary);text-align:center;
  }

  .completed-section{margin-top:28px;}
  .completed-section h2{
    font-size:16px;font-weight:700;margin:0 0 12px;
  }
  .completed-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  }
  .completed-card .task-list{padding:6px 8px;}
  .completed-card .task-item label{color:var(--text-secondary);text-decoration:line-through;}
  .completed-empty{
    padding:16px;font-size:13px;color:var(--text-secondary);text-align:center;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
  }

  .calendar-legend{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;
  }
  .legend-item{
    display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);
  }
  .legend-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

  footer{
    padding:16px;text-align:center;font-size:12px;color:var(--text-secondary);
  }

  @media (max-width: 780px){
    .layout{flex-direction:column;}
    .sidebar{
      flex:0 0 auto;width:100%;
      padding:10px 6px;border-bottom:1px solid var(--sidebar-border);
    }
  }

  @media print{
    .sidebar{display:none;}
    .print-btn{display:none;}
    body{background:#fff;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-badge"><img id="logo-img" alt="Fibonacci Engenharia" /></div>
    <div class="header-text">
      <h1>FIBONACCI ENGENHARIA</h1>
      <p id="header-sub">Checklist de obras — Via Towers &amp; Sports Garden</p>
    </div>
    <div class="header-progress">
      <div class="label">Progresso geral <b id="overall-pct">0%</b></div>
      <div class="track"><div class="fill" id="overall-fill" style="width:0%"></div></div>
    </div>
    <button class="theme-toggle-btn no-capture" id="theme-toggle-btn" title="Alternar tema claro/escuro">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
    <button class="print-btn no-capture" id="download-img-btn">Baixar imagem</button>
  </header>

  <div class="layout">
    <div class="sidebar no-capture" id="sidebar-nav"></div>

    <main>
      <div id="content"></div>
    </main>
  </div>

  <footer id="footer">Carregando...</footer>
  <footer id="diag-info" style="opacity:0.6;font-size:10.5px;">[diagnóstico] carregando...</footer>
</div>

<div class="modal-overlay no-capture" id="modal-overlay">
  <div class="modal-card" id="modal-card"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

const THEME_STORAGE_KEY = 'fibonacci-checklist-theme';

function applyTheme(isDark){
  document.body.classList.toggle('theme-dark', isDark);
}

function initTheme(){
  let isDark = false;
  try{
    const saved = localStorage.getItem(THEME_STORAGE_KEY);
    if (saved === 'dark') isDark = true;
    else if (saved === 'light') isDark = false;
    else if (window.matchMedia) isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  }catch(e){
    // localStorage indisponível — segue com o tema claro padrão
  }
  applyTheme(isDark);
}

document.getElementById('theme-toggle-btn').addEventListener('click', () => {
  const isDark = !document.body.classList.contains('theme-dark');
  applyTheme(isDark);
  try{ localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light'); }catch(e){
    // preferência não pôde ser salva; o tema ainda funciona nesta sessão
  }
});

function mergeSeed(base, custom, hidden){
  hidden = hidden || {};
  const result = {};
  Object.keys(base).forEach(sala => {
    result[sala] = {};
    Object.keys(base[sala]).forEach(func => {
      const kept = base[sala][func].filter(entry => {
        const text = Array.isArray(entry) ? entry[0] : entry;
        return !hidden[taskKey(func, sala, text)];
      });
      if (kept.length) result[sala][func] = kept.slice();
    });
  });
  Object.keys(custom || {}).forEach(sala => {
    if (!result[sala]) result[sala] = {};
    Object.keys(custom[sala]).forEach(func => {
      if (!result[sala][func]) result[sala][func] = [];
      result[sala][func] = result[sala][func].concat(custom[sala][func]);
    });
  });
  return result;
}

  return EMPLOYEE_COLORS[hash % EMPLOYEE_COLORS.length];
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Cada tarefa no SEED pode ser:
// - uma string simples: tarefa normal, começa desmarcada e sem dia definido
// - um par [texto, true]: tarefa "resolvida/histórica" (some do levantamento
//   atual mas continua aparecendo riscada, já marcada por padrão)
// - um trio [texto, doneBool, ["seg","qua",...]]: além do estado, já vem com
//   os dias da semana pré-marcados (informados junto com o levantamento)
function taskInfo(entry){
  if (Array.isArray(entry)){
    return {
      text: entry[0],
      defaultDone: !!entry[1],
      defaultDays: Array.isArray(entry[2]) ? entry[2] : []
    };
  }
  return { text: entry, defaultDone: false, defaultDays: [] };
}

function taskKey(func, sala, text){
  return `${func}|${sala}|${text}`;
}

function allTaskEntries(seed){
  const entries = [];
  for (const sala of Object.keys(seed)){
    for (const func of Object.keys(seed[sala])){
      seed[sala][func].forEach(raw => {
        const { text, defaultDone, defaultDays } = taskInfo(raw);
        entries.push({ key: taskKey(func, sala, text), defaultDone, defaultDays });
      });
    }
  }
  return entries;
}

    const timer = setTimeout(() => {
      reject({ code: 'timeout', message: `Tempo esgotado esperando "${label}" (${ms/1000}s)` });

/**
 * O Firebase Realtime Database proíbe ".", "#", "$", "[" e "]" em nomes de
 * chave — e o texto das nossas tarefas usa pontuação normal (frases
 * terminando em ".", por exemplo), então as chaves compostas
 * "func|sala|texto" quebrariam a gravação inteira sem essa camada. Só as
 * chaves de objetos "dicionário" (done, schedule, hiddenTasks, archived,
 * e os dois níveis de customSeed) passam por isso — o resto do app nunca
 * vê essa codificação, ela existe só na fronteira com o Firebase.
 */
function fbEncodeKeyPart(key){
  return btoa(unescape(encodeURIComponent(String(key))))
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/, '');
}
function fbDecodeKeyPart(encoded){
  let b64 = String(encoded).replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  return decodeURIComponent(escape(atob(b64)));
}
function encodeKeyedMapForFirebase(map){
  if (!map) return map;
  const out = {};
  Object.keys(map).forEach(k => { out[fbEncodeKeyPart(k)] = map[k]; });
  return out;
}
function decodeKeyedMapFromFirebase(map){
  if (!map) return map;
  const out = {};
  Object.keys(map).forEach(k => { out[fbDecodeKeyPart(k)] = map[k]; });
  return out;
}
/**
 * O schedule precisa de uma codificação própria: se todos os dias de uma
 * tarefa forem desmarcados, o valor vira um array vazio — e o Firebase
 * trata array/objeto vazio como "nada aqui", apagando o campo de verdade.
 * Ao recarregar, isso faz o app cair de volta no dia padrão original. Pra
 * evitar isso, guardamos cada dia como true/false explícito (um objeto que
 * nunca fica vazio de verdade), em vez de um array que pode ficar vazio.
 */
function encodeScheduleForFirebase(scheduleMap){
  if (!scheduleMap) return scheduleMap;
  const out = {};
  Object.keys(scheduleMap).forEach(k => {
    const daysArr = Array.isArray(scheduleMap[k]) ? scheduleMap[k] : [];
    const dayObj = {};
    DAYS.forEach(({ code }) => { dayObj[code] = daysArr.includes(code); });
    out[fbEncodeKeyPart(k)] = dayObj;
  });
  return out;
}
function decodeScheduleFromFirebase(scheduleMap){
  if (!scheduleMap) return scheduleMap;
  const out = {};
  Object.keys(scheduleMap).forEach(encKey => {
    const key = fbDecodeKeyPart(encKey);
    const dayObj = scheduleMap[encKey] || {};
    out[key] = DAYS.filter(({ code }) => dayObj[code] === true).map(({ code }) => code);
  });
  return out;
}
function encodeCustomSeedForFirebase(customSeed){
  if (!customSeed) return customSeed;
  const out = {};
  Object.keys(customSeed).forEach(sala => {
    const encSala = fbEncodeKeyPart(sala);
    out[encSala] = {};
    Object.keys(customSeed[sala]).forEach(func => {
      out[encSala][fbEncodeKeyPart(func)] = customSeed[sala][func];
    });
  });
  return out;
}
function decodeCustomSeedFromFirebase(customSeed){
  if (!customSeed) return customSeed;
  const out = {};
  Object.keys(customSeed).forEach(encSala => {
    const sala = fbDecodeKeyPart(encSala);
    out[sala] = {};
    Object.keys(customSeed[encSala]).forEach(encFunc => {
      out[sala][fbDecodeKeyPart(encFunc)] = customSeed[encSala][encFunc];
    });
  });
  return out;
}

      return snap.exists ? (snap.data() || {}) : {};
    }catch(e){
      console.error('Falha ao ler do db', e);
      updateDiag({ lastError: 'leitura: ' + (e && (e.code || e.message) || String(e)) });
      return {};
    }
  }
  if (window.storage){
    updateDiag({ backend: 'window.storage (prévia do chat)' });
    try{
      const result = await withTimeout(window.storage.get(STORAGE_KEY, true), 12000, 'window.storage.get');
      if (result && result.value) return JSON.parse(result.value);
    }catch(e){
      // ainda não existe nada salvo para esta obra
    }

async function writeStoredPayload(payload){
  const fbDb = getFirebaseDb();
  if (fbDb){
    const fbPayload = {
      done: encodeKeyedMapForFirebase(payload.done),
      schedule: encodeScheduleForFirebase(payload.schedule),
      hiddenTasks: encodeKeyedMapForFirebase(payload.hiddenTasks),
      archived: encodeKeyedMapForFirebase(payload.archived),
      customSeed: encodeCustomSeedForFirebase(payload.customSeed),
      lastUpdated: payload.lastUpdated
    };
    await withTimeout(fbDb.ref('state/' + STORAGE_KEY).set(fbPayload), 12000, 'Firebase: salvar');
    return;
  }

  if (hasAppsScriptBackend()){
    await withTimeout(callAppsScript('saveChecklistData', payload), 12000, 'Apps Script: salvar');
    return;
  }

  const db = await getDb();
  if (db){
    await withTimeout(db.doc('state/' + STORAGE_KEY).set(payload), 12000, 'db.set');
    return;

  if (window.storage){
    await withTimeout(window.storage.set(STORAGE_KEY, JSON.stringify(payload), true), 12000, 'window.storage.set');
    return;
  }
  throw new Error('Nenhum backend de armazenamento disponível nesta visualização.');
}

async function loadState(){
  let storedDone = {};
  let storedSchedule = {};
  let storedCustomSeed = {};
  let storedArchived = {};
  let storedHiddenTasks = {};
  let lastUpdated = null;

  try{
    const parsed = await loadStoredPayload();
    if (parsed && parsed.done) storedDone = parsed.done;
    if (parsed && parsed.schedule) storedSchedule = parsed.schedule;
    // customSeed/archived/hiddenTasks são clonados (em vez de usados por
    // referência direta) porque o objeto que volta do banco pode não ser
    // editável — mutar ele direto falha em silêncio ou lança erro.
    if (parsed && parsed.customSeed) storedCustomSeed = JSON.parse(JSON.stringify(parsed.customSeed));
    if (parsed && parsed.archived) storedArchived = JSON.parse(JSON.stringify(parsed.archived));
    if (parsed && parsed.hiddenTasks) storedHiddenTasks = JSON.parse(JSON.stringify(parsed.hiddenTasks));
    if (parsed && parsed.lastUpdated) lastUpdated = parsed.lastUpdated;
  }catch(e){
    // ainda não existe nada salvo para esta obra, segue com storedDone vazio
  }

  // a estrutura "base" vem do checklist mais recente que eu montei; a ela se
  // somam salas/atividades cadastradas por você direto no site (customSeed),
  // que ficam salvas independentemente de qualquer atualização futura que eu
  // fizer no código. Só o progresso (done) e o agendamento (schedule) são
  // recuperados do que já estava salvo, tarefa a tarefa (pela chave
  // func|sala|texto), pra sobreviver a reorganizações sem perder marcações.
  const seed = mergeSeed(BASE_SEED, storedCustomSeed, storedHiddenTasks);

  const done = {};
  const schedule = {};
  allTaskEntries(seed).forEach(({ key, defaultDone, defaultDays }) => {
    done[key] = storedDone.hasOwnProperty(key) ? !!storedDone[key] : defaultDone;
    schedule[key] = Array.isArray(storedSchedule[key])
      ? storedSchedule[key].filter(d => DAYS.some(D => D.code === d))
      : (defaultDays || []).filter(d => DAYS.some(D => D.code === d));
  });

  const state = { seed, customSeed: storedCustomSeed, archived: storedArchived, hiddenTasks: storedHiddenTasks, done, schedule, lastUpdated };
  await saveState(state, false);
  return state;
}

    }
  }
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

function isPurchaseTask(text){
  return /compr/i.test(text);
}

/** Cria uma sala nova (vazia) se ainda não existir. Retorna false se já existia. */
function addCustomSala(state, salaName){
  const name = String(salaName || '').trim();
  if (!name || state.seed[name]) return false;
  if (!state.customSeed[name]) state.customSeed[name] = {};
  state.seed = mergeSeed(BASE_SEED, state.customSeed, state.hiddenTasks);
  return true;
}

function archiveSala(state, sala){
  state.archived[sala] = true;
}

function unarchiveSala(state, sala){

}

/**
 * Cadastra uma atividade nova numa sala (existente ou recém-criada).
 * Aplica a regra automática: texto com "Comprar"/"Compra" vai pro
 * funcionário virtual "Compras", independente do responsável escolhido.
 */
function addCustomTask(state, sala, func, text, days){
  const cleanText = String(text || '').trim();
  if (!cleanText) return null;

  const effectiveFunc = isPurchaseTask(cleanText) ? 'Compras' : (String(func || '').trim() || 'Sem responsável');
  const cleanDays = Array.isArray(days) ? days.filter(d => DAYS.some(D => D.code === d)) : [];

  if (!state.customSeed[sala]) state.customSeed[sala] = {};
  if (!state.customSeed[sala][effectiveFunc]) state.customSeed[sala][effectiveFunc] = [];
  state.customSeed[sala][effectiveFunc].push(cleanDays.length ? [cleanText, false, cleanDays] : cleanText);

  state.seed = mergeSeed(BASE_SEED, state.customSeed, state.hiddenTasks);

  const key = taskKey(effectiveFunc, sala, cleanText);
  state.done[key] = false;
  if (cleanDays.length) state.schedule[key] = cleanDays;

  return { func: effectiveFunc, key, redirected: effectiveFunc === 'Compras' && effectiveFunc !== func };
}

/** Remove uma entrada específica do customSeed (usado ao editar/mover uma tarefa cadastrada por você). */
function removeFromCustomSeed(state, sala, func, text){
  if (state.customSeed[sala] && state.customSeed[sala][func]){
    state.customSeed[sala][func] = state.customSeed[sala][func].filter(entry => {
      const t = Array.isArray(entry) ? entry[0] : entry;
      return t !== text;
    });
    if (state.customSeed[sala][func].length === 0) delete state.customSeed[sala][func];
    if (Object.keys(state.customSeed[sala]).length === 0) delete state.customSeed[sala];
  }
}

/**
 * Edita uma atividade já existente (texto, responsável e/ou dias) — seja ela
 * vinda do levantamento original ou cadastrada por você. A tarefa antiga é
 * "escondida" (não é possível mudar o BASE_SEED, que vem do código) e uma
 * nova entrada equivalente entra no customSeed, migrando o progresso (done)
 * e o agendamento (schedule) da chave antiga pra chave nova.
 */
function editTask(state, sala, oldFunc, oldText, newFunc, newText, days){
  const oldKey = taskKey(oldFunc, sala, oldText);
  const cleanText = String(newText || '').trim();
  if (!cleanText) return null;
  const effectiveFunc = isPurchaseTask(cleanText) ? 'Compras' : (String(newFunc || '').trim() || oldFunc);
  const cleanDays = Array.isArray(days) ? days.filter(d => DAYS.some(D => D.code === d)) : [];
  const newKey = taskKey(effectiveFunc, sala, cleanText);

  if (!state.hiddenTasks) state.hiddenTasks = {};

  if (oldKey !== newKey){
    state.hiddenTasks[oldKey] = true;
    removeFromCustomSeed(state, sala, oldFunc, oldText);

    if (!state.customSeed[sala]) state.customSeed[sala] = {};
    if (!state.customSeed[sala][effectiveFunc]) state.customSeed[sala][effectiveFunc] = [];
    state.customSeed[sala][effectiveFunc].push(cleanDays.length ? [cleanText, false, cleanDays] : cleanText);

    state.seed = mergeSeed(BASE_SEED, state.customSeed, state.hiddenTasks);

    state.done[newKey] = !!state.done[oldKey];
    delete state.done[oldKey];
    delete state.schedule[oldKey];
    if (cleanDays.length) state.schedule[newKey] = cleanDays; else delete state.schedule[newKey];
  } else if (cleanDays.length){
    state.schedule[newKey] = cleanDays;
  } else {
    delete state.schedule[newKey];
  }

  return { func: effectiveFunc, key: newKey };
}

/**
 * Apaga uma atividade por completo — funciona tanto pra tarefas do
 * levantamento original (BASE_SEED, que a gente não pode editar de verdade,
 * então só "esconde") quanto pra tarefas cadastradas por você (customSeed,
 * removida de fato). Limpa também o progresso e o agendamento dela.
 */
function deleteTask(state, sala, func, text){
  const key = taskKey(func, sala, text);
  if (!state.hiddenTasks) state.hiddenTasks = {};
  state.hiddenTasks[key] = true;
  removeFromCustomSeed(state, sala, func, text);
  state.seed = mergeSeed(BASE_SEED, state.customSeed, state.hiddenTasks);
  delete state.done[key];
  delete state.schedule[key];
  return { key };
}

async function saveState(state, updateStamp = true){
  const stampBackup = state.lastUpdated;
  if (updateStamp) state.lastUpdated = new Date().toISOString();
  const payload = {
    done: state.done,
    schedule: state.schedule,
    customSeed: state.customSeed,
    archived: state.archived,
    hiddenTasks: state.hiddenTasks,
    lastUpdated: state.lastUpdated
  };
  try{
    await writeStoredPayload(payload);
    renderFooter(state);
    updateDiag({ lastAction: 'gravação OK em ' + new Date().toLocaleTimeString('pt-BR'), lastError: '' });
    return true;
  }catch(e){
    console.error('Falha ao salvar checklist', e);
    state.lastUpdated = stampBackup;
    renderFooter(state);
    updateDiag({ lastAction: 'FALHA na gravação em ' + new Date().toLocaleTimeString('pt-BR'), lastError: (e && (e.code || e.message)) || String(e) });
    return false;
  }
}

function parseKey(key){

function overallCounts(state){

  const done = keys.filter(k => state.done[k]).length;

function employeeCounts(state, employee){
  const keys = Object.keys(state.done).filter(k => {
    const p = parseKey(k);
    return p.func === employee && !state.archived[p.sala];
  });
  const total = keys.length;
  const done = keys.filter(k => state.done[k]).length;
  return { done, total };
}

function salaCounts(state, sala){
  const keys = Object.keys(state.done).filter(k => parseKey(k).sala === sala);
  const total = keys.length;
  const done = keys.filter(k => state.done[k]).length;
  return { done, total };
}

  { key: 'obras', label: 'Obras', hasSublist: true },
  { key: 'calendario', label: 'Calendário semanal', hasSublist: false },
  { key: 'prestadores', label: 'Prestadores', hasSublist: true },
  { key: 'compras', label: 'Compras', hasSublist: false },
  { key: 'arquivadas', label: 'Arquivadas', hasSublist: true }
];

function renderNav(state){
  const employees = employeesFromSeed(state.seed).filter(emp => emp !== 'Compras');
  const allSalas = Object.keys(state.seed);
  const activeSalas = allSalas.filter(s => !state.archived[s]);
  const archivedSalas = allSalas.filter(s => !!state.archived[s]);

  if (activeSection === 'prestadores' && !activeEmployee && employees.length){
    activeEmployee = employees[0];
  }

  const navEl = document.getElementById('sidebar-nav');
  navEl.innerHTML = '';

  NAV_SECTIONS.forEach(({ key, label, hasSublist }) => {
    const section = document.createElement('div');
    section.className = 'nav-section';

    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (activeSection === key ? ' active' : '') + (activeSection === key && hasSublist ? ' expanded' : '');
    btn.innerHTML = `<span class="nav-icon">${NAV_ICONS[key]}</span><span class="nav-label">${label}</span>` + (hasSublist ? '<span class="nav-arrow">▶</span>' : '');
    btn.onclick = () => {
      activeSection = key;
      render();
    };
    section.appendChild(btn);

    if (hasSublist){
      const sublist = document.createElement('div');
      sublist.className = 'nav-sublist' + (activeSection === key ? ' expanded' : '');

      if (key === 'obras'){
        if (activeSalas.length === 0){
          sublist.innerHTML = '<div class="tab-empty">Nenhuma sala ativa</div>';
        }
        activeSalas.forEach(sala => {
          const { done, total } = salaCounts(state, sala);
          const item = document.createElement('button');
          item.className = 'tab' + (activeSection === 'obras' && sala === activeSala ? ' active' : '');
          item.innerHTML = `<span>${sala}</span><span class="count">${done}/${total}</span>`;
          item.onclick = () => { activeSection = 'obras'; activeSala = sala; render(); };
          sublist.appendChild(item);
        });
      }

      if (key === 'prestadores'){
        employees.forEach(emp => {
          const { done, total } = employeeCounts(state, emp);
          const item = document.createElement('button');
          item.className = 'tab' + (activeSection === 'prestadores' && emp === activeEmployee ? ' active' : '');
          item.innerHTML = `<span>${emp}</span><span class="count">${done}/${total}</span>`;
          item.onclick = () => { activeSection = 'prestadores'; activeEmployee = emp; render(); };
          sublist.appendChild(item);
        });
      }

      if (key === 'arquivadas'){
        if (archivedSalas.length === 0){
          sublist.innerHTML = '<div class="tab-empty">Nenhuma sala arquivada</div>';
        }
        archivedSalas.forEach(sala => {
          const { done, total } = salaCounts(state, sala);
          const item = document.createElement('button');
          item.className = 'tab' + (activeSection === 'arquivadas' && sala === activeSala ? ' active' : '');
          item.innerHTML = `<span>${sala}</span><span class="count">${done}/${total}</span>`;
          item.onclick = () => { activeSection = 'arquivadas'; activeSala = sala; render(); };
          sublist.appendChild(item);
        });
      }

      section.appendChild(sublist);
    }

    navEl.appendChild(section);
  });

  const newSalaBtn = document.createElement('button');
  newSalaBtn.className = 'new-sala-btn';
  newSalaBtn.textContent = '+ Nova sala';
  newSalaBtn.onclick = showNewSalaModal;
  navEl.appendChild(newSalaBtn);
}

const EDIT_ICON_SVG = '<svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

/**
 * Monta um <li> de tarefa completo: checkbox, texto (com contexto opcional,
 * usado nas visões agregadas), botão de editar e os pills de dia. Usada por
 * renderGroupCard e renderGeralCard pra não duplicar essa lógica.
 */
function renderTaskItem(state, func, sala, text, opts){
  opts = opts || {};
  const key = taskKey(func, sala, text);
  const li = document.createElement('li');
  li.className = 'task-item';
  const inputId = 'chk_' + key.replace(/[^a-zA-Z0-9]/g, '_');
  const contextHtml = opts.showContext ? `<span class="chip-context" style="display:block;">${func}</span>` : '';
  li.innerHTML = `
    <input type="checkbox" id="${inputId}" />
    <div class="task-item-body">
      <div class="task-item-row">
        <label for="${inputId}">${contextHtml}${text}</label>
        <button type="button" class="edit-task-btn no-capture" title="Editar atividade">${EDIT_ICON_SVG}</button>
      </div>
      <div class="day-pills"></div>
    </div>
  `;
  const checkbox = li.querySelector('input');
  checkbox.addEventListener('change', async () => {
    state.done[key] = checkbox.checked;
    await saveState(state);
    render();
  });

  const pillsEl = li.querySelector('.day-pills');
  const scheduled = state.schedule[key] || [];
  DAYS.forEach(({ code, label }) => {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'day-pill' + (scheduled.includes(code) ? ' active' : '');
    pill.textContent = label;
    pill.title = `Agendar para ${label}`;
    pill.addEventListener('click', async () => {
      const current = state.schedule[key] || [];
      state.schedule[key] = current.includes(code)
        ? current.filter(d => d !== code)
        : [...current, code];
      await saveState(state);
      render();
    });
    pillsEl.appendChild(pill);
  });

  li.querySelector('.edit-task-btn').addEventListener('click', () => {
    showEditTaskModal(sala, func, text);
  });

  return li;
}

function renderGroupCard(state, groupTitle, rawTasks, func, sala){
  const card = document.createElement('div');
  card.className = 'sala-card';

  const tasks = rawTasks.map(taskInfo);
  const groupDone = tasks.filter(t => state.done[taskKey(func, sala, t.text)]).length;
  const activeTasks = tasks.filter(t => !state.done[taskKey(func, sala, t.text)]);

  const head = document.createElement('div');
  head.className = 'sala-head';
  head.innerHTML = `<h3>${groupTitle}</h3><span class="sala-count">${groupDone}/${tasks.length}</span>`;
  card.appendChild(head);

  const list = document.createElement('ul');
  list.className = 'task-list';

  if (activeTasks.length === 0){
    list.innerHTML = '<li class="task-list-empty">Tudo concluído por aqui 🎉</li>';
  }

  activeTasks.forEach(({ text }) => {
    list.appendChild(renderTaskItem(state, func, sala, text));
  });

  card.appendChild(list);
  return card;
}

function collectScheduledTasks(state, filterFn){
  const results = [];
  for (const sala of Object.keys(state.seed)){
    for (const func of Object.keys(state.seed[sala])){
      if (!filterFn(func, sala)) continue;
      state.seed[sala][func].map(taskInfo).forEach(({ text }) => {
        const key = taskKey(func, sala, text);
        const days = state.schedule[key] || [];
        const isDone = !!state.done[key];
        // tarefas concluídas saem do calendário (ficam só na lista de concluídas)
        if (days.length > 0 && !isDone){
          results.push({ func, sala, text, key, days, done: isDone });
        }
      });
    }
  }
  return results;
}

function renderWeekCalendar(state, title, filterFn, contextLabelFn){
  const section = document.createElement('div');
  section.className = 'calendar-section';

  const heading = document.createElement('h2');
  heading.textContent = title;
  section.appendChild(heading);

  const tasks = collectScheduledTasks(state, filterFn);

  const distinctEmployees = Array.from(new Set(tasks.map(t => t.func))).sort((a, b) => a.localeCompare(b, 'pt-BR'));
  if (distinctEmployees.length > 1){
    const legend = document.createElement('div');
    legend.className = 'calendar-legend';
    distinctEmployees.forEach(emp => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-swatch" style="background:${colorForEmployee(emp)}"></span>${emp}`;
      legend.appendChild(item);
    });
    section.appendChild(legend);
  }

  const grid = document.createElement('div');
  grid.className = 'calendar-grid';

  DAYS.forEach(({ code, label }) => {
    const dayEl = document.createElement('div');
    dayEl.className = 'calendar-day';

    const head = document.createElement('div');
    head.className = 'calendar-day-head';
    head.textContent = label;
    dayEl.appendChild(head);

    const body = document.createElement('div');
    body.className = 'calendar-day-body';

    const dayTasks = tasks.filter(t => t.days.includes(code));
    if (dayTasks.length === 0){
      body.innerHTML = '<div class="calendar-day-empty">—</div>';
    } else {
      dayTasks.forEach(t => {
        const color = colorForEmployee(t.func);
        const chip = document.createElement('div');
        chip.className = 'calendar-chip' + (t.done ? ' done' : '');
        chip.style.borderLeft = `4px solid ${color}`;
        chip.style.background = hexToRgba(color, 0.1);
        const ctx = contextLabelFn ? contextLabelFn(t) : '';
        chip.innerHTML = (ctx ? `<span class="chip-context" style="color:${color}">${ctx}</span>` : '') + t.text;
        body.appendChild(chip);
      });
    }

    dayEl.appendChild(body);
    grid.appendChild(dayEl);
  });

  section.appendChild(grid);
  return section;
}

function collectDoneTasks(state, filterFn){
  const results = [];
  for (const sala of Object.keys(state.seed)){
    for (const func of Object.keys(state.seed[sala])){
      if (!filterFn(func, sala)) continue;
      state.seed[sala][func].map(taskInfo).forEach(({ text }) => {
        const key = taskKey(func, sala, text);
        if (state.done[key]) results.push({ func, sala, text, key });
      });
    }
  }
  return results;
}

function renderCompletedList(state, title, filterFn, contextLabelFn){
  const section = document.createElement('div');
  section.className = 'completed-section no-capture';

  const heading = document.createElement('h2');
  heading.textContent = title;
  section.appendChild(heading);

  const doneTasks = collectDoneTasks(state, filterFn);

  if (doneTasks.length === 0){
    const empty = document.createElement('div');
    empty.className = 'completed-empty';
    empty.textContent = 'Nenhuma tarefa concluída ainda.';
    section.appendChild(empty);
    return section;
  }

  const card = document.createElement('div');
  card.className = 'completed-card';
  const list = document.createElement('ul');
  list.className = 'task-list';

  doneTasks.forEach(({ func, sala, text, key }) => {
    const li = document.createElement('li');
    li.className = 'task-item done';
    const inputId = 'chk_done_' + key.replace(/[^a-zA-Z0-9]/g, '_');
    const ctx = contextLabelFn ? contextLabelFn({ func, sala }) : '';
    li.innerHTML = `
      <input type="checkbox" id="${inputId}" checked />
      <div class="task-item-body">
        <label for="${inputId}">${ctx ? `<span class="chip-context" style="display:block;">${ctx}</span>` : ''}${text}</label>
      </div>
    `;
    const checkbox = li.querySelector('input');
    checkbox.addEventListener('change', async () => {
      state.done[key] = checkbox.checked;
      await saveState(state);
      render();
    });
    list.appendChild(li);
  });

  card.appendChild(list);
  section.appendChild(card);
  return section;
}

function renderSalaDetail(state, sala, isArchivedView){
  const contentEl = document.getElementById('content');

  const { done, total } = salaCounts(state, sala);
  const pct = total ? Math.round((done/total)*100) : 0;

  const nameEl = document.createElement('div');
  nameEl.className = 'employee-name';
  nameEl.textContent = sala;
  contentEl.appendChild(nameEl);

  const progressEl = document.createElement('div');
  progressEl.className = 'employee-progress';
  progressEl.innerHTML = `
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="pct">${done}/${total} tarefas</div>
  `;
  contentEl.appendChild(progressEl);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-task-btn no-capture';
  addBtn.textContent = '+ Cadastrar atividade';
  addBtn.onclick = () => showAddTaskModal(sala);
  contentEl.appendChild(addBtn);

  const archiveBtn = document.createElement('button');
  archiveBtn.className = 'archive-btn no-capture';
  const archiveDefaultText = isArchivedView ? 'Desarquivar sala' : 'Arquivar sala';
  archiveBtn.textContent = archiveDefaultText;
  archiveBtn.onclick = async () => {
    archiveBtn.textContent = 'Salvando...';
    archiveBtn.disabled = true;

    if (isArchivedView){
      unarchiveSala(state, sala);
    } else {
      archiveSala(state, sala);
    }

    const ok = await saveState(state);

    if (!ok){
      archiveBtn.textContent = archiveDefaultText;
      archiveBtn.disabled = false;
      alert('Não foi possível salvar agora. Tente novamente em instantes.');
      // desfaz a mudança local já que não foi possível confirmar o salvamento
      if (isArchivedView){ archiveSala(state, sala); } else { unarchiveSala(state, sala); }
      return;
    }

    activeSection = isArchivedView ? 'obras' : 'arquivadas';
    activeSala = sala;
    render();
  };
  contentEl.appendChild(archiveBtn);

  const board = document.createElement('div');
  board.className = 'sala-board';
  let anyEmployee = false;

  const employeesInSala = employeesFromSeed(state.seed).filter(emp => (state.seed[sala][emp] || []).length > 0);

  employeesInSala.forEach(emp => {
    const tasks = state.seed[sala][emp] || [];
    if (tasks.length === 0) return;
    anyEmployee = true;
    const card = renderGroupCard(state, emp, tasks, emp, sala);
    board.appendChild(card);
  });

  contentEl.appendChild(board);

  if (!anyEmployee){
    const emptyEl = document.createElement('div');
    emptyEl.className = 'empty';
    emptyEl.textContent = 'Nenhuma tarefa cadastrada para esta sala.';
    contentEl.appendChild(emptyEl);
  }

  contentEl.appendChild(renderWeekCalendar(
    state,
    `Calendário semanal — ${sala}`,
    (func, s) => s === sala,
    (t) => t.func
  ));
  contentEl.appendChild(renderCompletedList(
    state,
    `Tarefas concluídas — ${sala}`,
    (func, s) => s === sala,
    (t) => t.func
  ));
}

function renderEmployeeDetail(state, employee){
  const contentEl = document.getElementById('content');

  const { done, total } = employeeCounts(state, employee);
  const pct = total ? Math.round((done/total)*100) : 0;

  const nameEl = document.createElement('div');
  nameEl.className = 'employee-name';
  nameEl.textContent = employee;
  contentEl.appendChild(nameEl);

  const progressEl = document.createElement('div');
  progressEl.className = 'employee-progress';
  progressEl.innerHTML = `
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="pct">${done}/${total} tarefas</div>
  `;
  contentEl.appendChild(progressEl);

  let anyRoom = false;
  const board = document.createElement('div');
  board.className = 'sala-board';

  Object.keys(state.seed).forEach(sala => {
    if (state.archived[sala]) return;
    const tasks = (state.seed[sala] && state.seed[sala][employee]) || [];
    if (tasks.length === 0) return;
    anyRoom = true;
    const card = renderGroupCard(state, sala, tasks, employee, sala);
    board.appendChild(card);
  });

  contentEl.appendChild(board);

  if (!anyRoom){
    const emptyEl = document.createElement('div');
    emptyEl.className = 'empty';
    emptyEl.textContent = 'Nenhuma tarefa cadastrada para este funcionário.';
    contentEl.appendChild(emptyEl);
  }

  contentEl.appendChild(renderWeekCalendar(
    state,
    `Calendário semanal — ${employee}`,
    (func, sala) => func === employee && !state.archived[sala],
    (t) => t.sala
  ));
  contentEl.appendChild(renderCompletedList(
    state,
    `Tarefas concluídas — ${employee}`,
    (func, sala) => func === employee && !state.archived[sala],
    (t) => t.sala
  ));
}

function renderContent(state){
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '';

  const allSalas = Object.keys(state.seed);
  const activeSalas = allSalas.filter(s => !state.archived[s]);
  const archivedSalas = allSalas.filter(s => !!state.archived[s]);

  if (activeSection === 'calendario'){
    const nameEl = document.createElement('div');
    nameEl.className = 'employee-name';
    nameEl.textContent = 'Calendário semanal — geral';
    contentEl.appendChild(nameEl);
    contentEl.appendChild(renderWeekCalendar(
      state,
      'Todas as salas e prestadores',
      (func, sala) => !state.archived[sala],
      (t) => `${t.func} · ${t.sala}`
    ));
    return;
  }

  if (activeSection === 'obras'){
    if (!activeSala || !activeSalas.includes(activeSala)){
      renderSalaAggregate(state, activeSalas, 'Obras — todas as salas', 'Nenhuma sala ativa no momento.');
      return;
    }
    renderSalaDetail(state, activeSala, false);
    return;
  }

  if (activeSection === 'arquivadas'){
    if (!activeSala || !archivedSalas.includes(activeSala)){
      renderSalaAggregate(state, archivedSalas, 'Arquivadas', 'Nenhuma sala arquivada.');
      return;
    }
    renderSalaDetail(state, activeSala, true);
    return;
  }

  if (activeSection === 'compras'){
    renderEmployeeDetail(state, 'Compras');
    return;
  }

  // prestadores
  if (!activeEmployee){
    contentEl.innerHTML = '<div class="empty">Nenhum funcionário encontrado.</div>';
    return;
  }
  renderEmployeeDetail(state, activeEmployee);
}

function renderGeralCard(state, sala){
  const card = document.createElement('div');
  card.className = 'sala-card';

  const employeesInSala = employeesFromSeed(state.seed).filter(emp => (state.seed[sala][emp] || []).length > 0);
  const allTasks = [];
  employeesInSala.forEach(emp => {
    (state.seed[sala][emp] || []).map(taskInfo).forEach(({ text }) => {
      allTasks.push({ func: emp, text, key: taskKey(emp, sala, text) });
    });
  });

  const groupDone = allTasks.filter(t => state.done[t.key]).length;
  const activeTasks = allTasks.filter(t => !state.done[t.key]);

  const head = document.createElement('div');
  head.className = 'sala-head';
  head.innerHTML = `<h3>${sala}</h3><span class="sala-count">${groupDone}/${allTasks.length}</span>`;
  card.appendChild(head);

  const list = document.createElement('ul');
  list.className = 'task-list';

  if (activeTasks.length === 0){
    list.innerHTML = '<li class="task-list-empty">Tudo concluído por aqui 🎉</li>';
  }

  activeTasks.forEach(({ func, text }) => {
    list.appendChild(renderTaskItem(state, func, sala, text, { showContext: true }));
  });

  card.appendChild(list);
  return card;
}

/**
 * Visão agregada de um conjunto de salas (usada por "Obras" sem sala
 * selecionada e por "Arquivadas" sem sala selecionada): um cartão por sala
 * + o calendário semanal restrito a essas salas.
 */
function renderSalaAggregate(state, salas, title, emptyMessage){
  const contentEl = document.getElementById('content');

  const keys = Object.keys(state.done).filter(k => salas.includes(parseKey(k).sala));
  const total = keys.length;
  const done = keys.filter(k => state.done[k]).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  const nameEl = document.createElement('div');
  nameEl.className = 'employee-name';
  nameEl.textContent = title;
  contentEl.appendChild(nameEl);

  const progressEl = document.createElement('div');
  progressEl.className = 'employee-progress';
  progressEl.innerHTML = `
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="pct">${done}/${total} tarefas</div>
  `;
  contentEl.appendChild(progressEl);

  if (salas.length === 0){
    const emptyEl = document.createElement('div');
    emptyEl.className = 'empty';
    emptyEl.textContent = emptyMessage;
    contentEl.appendChild(emptyEl);
    return;
  }

  const board = document.createElement('div');
  board.className = 'sala-board';
  salas.forEach(sala => {
    board.appendChild(renderGeralCard(state, sala));
  });
  contentEl.appendChild(board);

  contentEl.appendChild(renderWeekCalendar(
    state,
    `Calendário semanal — ${title}`,
    (func, sala) => salas.includes(sala),
    (t) => `${t.func} · ${t.sala}`
  ));
}

function render(){
  if (!appState) return;
  renderHeaderProgress(appState);
  renderNav(appState);
  renderContent(appState);
}

document.getElementById('download-img-btn').addEventListener('click', async () => {
  const btn = document.getElementById('download-img-btn');
  const originalText = btn.textContent;
  btn.textContent = 'Gerando...';
  btn.disabled = true;
  try{
    const target = document.querySelector('.wrap');
    const isDark = document.body.classList.contains('theme-dark');
    const canvas = await html2canvas(target, {
      backgroundColor: isDark ? '#121210' : '#F4F3EF',
      scale: 2,
      ignoreElements: (el) => el.classList && el.classList.contains('no-capture')
    });
    let label = 'checklist';
    if (activeSection === 'calendario') label = 'calendario-geral';
    else if (activeSection === 'compras') label = 'compras';
    else if (activeSection === 'prestadores') label = activeEmployee || 'prestador';
    else label = activeSala || activeSection; // obras / arquivadas
    const slug = label.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const filename = `checklist-via-towers-${slug}.png`;

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('Falha ao converter a captura em imagem.');

    const downloadsCap = await getDownloadsCapability();
    if (downloadsCap){
      // página publicada: um link de download comum fica inerte aqui —
      // precisa passar pela capability de downloads, que pede confirmação
      // do visitante antes de salvar.
      try{
        await downloadsCap.save({ filename, data: blob });
      }catch(saveErr){
        if (saveErr && saveErr.code === 'declined'){
          // visitante cancelou o salvamento — não é um erro de verdade
        } else {
          throw saveErr;
        }
      }
    } else {
      // prévia da conversa no chat: o link de download comum funciona normalmente
      const link = document.createElement('a');
      link.download = filename;
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
    }
  }catch(e){
    console.error('Falha ao gerar imagem', e);
    alert('Não foi possível gerar a imagem agora. Tente novamente em instantes.');
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
});

function showNewSalaModal(){
  openModal(`
    <h3>Nova sala</h3>
    <div class="modal-field">
      <label for="new-sala-name">Nome da sala</label>
      <input type="text" id="new-sala-name" placeholder="Ex: Sala 1301" />
    </div>
    <div class="modal-error" id="new-sala-error"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="new-sala-cancel">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" id="new-sala-confirm">Criar sala</button>
    </div>
  `);

  const input = document.getElementById('new-sala-name');
  input.focus();

  document.getElementById('new-sala-cancel').onclick = closeModal;
  document.getElementById('new-sala-confirm').onclick = async () => {
    const name = input.value.trim();
    const errEl = document.getElementById('new-sala-error');
    const confirmBtn = document.getElementById('new-sala-confirm');
    if (!name){
      errEl.textContent = 'Digite um nome pra sala.';
      errEl.classList.add('show');
      return;
    }
    if (appState.seed[name]){
      errEl.textContent = 'Já existe uma sala com esse nome.';
      errEl.classList.add('show');
      return;
    }

    errEl.classList.remove('show');
    confirmBtn.textContent = 'Criando...';
    confirmBtn.disabled = true;

    addCustomSala(appState, name);
    const ok = await saveState(appState);

    if (!ok){
      confirmBtn.textContent = 'Criar sala';
      confirmBtn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }

    activeSection = 'obras';
    activeSala = name;
    closeModal();
    render();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('new-sala-confirm').click();
  });
}

function showAddTaskModal(sala){
  const employees = employeesFromSeed(appState.seed);
  const optionsHtml = employees.map(emp => `<option value="${emp}">${emp}</option>`).join('');
  const dayButtonsHtml = DAYS.map(({ code, label }) =>
    `<button type="button" class="modal-day-chip" data-day="${code}">${label}</button>`
  ).join('');

  openModal(`
    <h3>Cadastrar atividade — ${sala}</h3>
    <div class="modal-field">
      <label for="task-text">Atividade</label>
      <input type="text" id="task-text" placeholder="Ex: Instalar porta do banheiro" />
    </div>
    <div class="modal-field">
      <label for="task-func-select">Responsável</label>
      <select id="task-func-select">
        ${optionsHtml}
        <option value="__new__">Outro (digitar nome novo)</option>
      </select>
    </div>
    <div class="modal-field" id="task-func-new-field" style="display:none;">
      <label for="task-func-new">Nome do novo responsável</label>
      <input type="text" id="task-func-new" placeholder="Ex: Neto" />
    </div>
    <div class="modal-field">
      <label>Dias (opcional)</label>
      <div class="modal-days">${dayButtonsHtml}</div>
    </div>
    <div class="modal-hint">Atividades com "Comprar"/"Compra" no texto vão automaticamente pra aba Compras.</div>
    <div class="modal-error" id="task-error"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="task-cancel">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" id="task-confirm">Cadastrar</button>
    </div>
  `);

  const textInput = document.getElementById('task-text');
  textInput.focus();

  const funcSelect = document.getElementById('task-func-select');
  const funcNewField = document.getElementById('task-func-new-field');
  const funcNewInput = document.getElementById('task-func-new');
  funcSelect.addEventListener('change', () => {
    funcNewField.style.display = funcSelect.value === '__new__' ? 'block' : 'none';
  });

  const selectedDays = new Set();
  document.querySelectorAll('.modal-day-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const day = chip.dataset.day;
      if (selectedDays.has(day)){
        selectedDays.delete(day);
        chip.classList.remove('active');
      } else {
        selectedDays.add(day);
        chip.classList.add('active');
      }
    });
  });

  document.getElementById('task-cancel').onclick = closeModal;
  document.getElementById('task-confirm').onclick = async () => {
    const errEl = document.getElementById('task-error');
    const confirmBtn = document.getElementById('task-confirm');
    const text = textInput.value.trim();
    const chosenFunc = funcSelect.value === '__new__' ? funcNewInput.value.trim() : funcSelect.value;

    if (!text){
      errEl.textContent = 'Digite o texto da atividade.';
      errEl.classList.add('show');
      return;
    }
    if (!chosenFunc){
      errEl.textContent = 'Escolha ou digite um responsável.';
      errEl.classList.add('show');
      return;
    }

    errEl.classList.remove('show');
    confirmBtn.textContent = 'Salvando...';
    confirmBtn.disabled = true;

    const addResult = addCustomTask(appState, sala, chosenFunc, text, Array.from(selectedDays));
    const ok = await saveState(appState);

    if (!ok){
      confirmBtn.textContent = 'Cadastrar';
      confirmBtn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }

    closeModal();
    render();
  };
}

function showEditTaskModal(sala, func, text){
  const employees = employeesFromSeed(appState.seed);
  const key = taskKey(func, sala, text);
  const currentDays = appState.schedule[key] || [];
  const optionsHtml = employees.map(emp =>
    `<option value="${emp}"${emp === func ? ' selected' : ''}>${emp}</option>`
  ).join('');
  const dayButtonsHtml = DAYS.map(({ code, label }) =>
    `<button type="button" class="modal-day-chip${currentDays.includes(code) ? ' active' : ''}" data-day="${code}">${label}</button>`
  ).join('');
  const escapedText = text.replace(/&/g, '&amp;').replace(/"/g, '&quot;');

  openModal(`
    <h3>Editar atividade — ${sala}</h3>
    <div class="modal-field">
      <label for="edit-task-text">Atividade</label>
      <input type="text" id="edit-task-text" value="${escapedText}" />
    </div>
    <div class="modal-field">
      <label for="edit-task-func-select">Responsável</label>
      <select id="edit-task-func-select">
        ${optionsHtml}
        <option value="__new__">Outro (digitar nome novo)</option>
      </select>
    </div>
    <div class="modal-field" id="edit-task-func-new-field" style="display:none;">
      <label for="edit-task-func-new">Nome do novo responsável</label>
      <input type="text" id="edit-task-func-new" placeholder="Ex: Neto" />
    </div>
    <div class="modal-field">
      <label>Dias</label>
      <div class="modal-days">${dayButtonsHtml}</div>
    </div>
    <div class="modal-hint">Atividades com "Comprar"/"Compra" no texto vão automaticamente pra aba Compras.</div>
    <div class="modal-error" id="edit-task-error"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-danger" id="edit-task-delete">Apagar atividade</button>
      <div style="flex:1;"></div>
      <button class="modal-btn modal-btn-cancel" id="edit-task-cancel">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" id="edit-task-confirm">Salvar alterações</button>
    </div>
  `);

  const textInput = document.getElementById('edit-task-text');
  textInput.focus();
  textInput.select();

  document.getElementById('edit-task-delete').onclick = async () => {
    const confirmado = confirm(`Apagar a atividade "${text}"? Essa ação não pode ser desfeita.`);
    if (!confirmado) return;

    const deleteBtn = document.getElementById('edit-task-delete');
    const errEl = document.getElementById('edit-task-error');
    deleteBtn.textContent = 'Apagando...';
    deleteBtn.disabled = true;

    deleteTask(appState, sala, func, text);
    const ok = await saveState(appState);

    if (!ok){
      deleteBtn.textContent = 'Apagar atividade';
      deleteBtn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }

    closeModal();
    render();
  };

  const funcSelect = document.getElementById('edit-task-func-select');
  const funcNewField = document.getElementById('edit-task-func-new-field');
  const funcNewInput = document.getElementById('edit-task-func-new');
  funcSelect.addEventListener('change', () => {
    funcNewField.style.display = funcSelect.value === '__new__' ? 'block' : 'none';
  });

  const selectedDays = new Set(currentDays);
  document.querySelectorAll('.modal-day-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const day = chip.dataset.day;
      if (selectedDays.has(day)){
        selectedDays.delete(day);
        chip.classList.remove('active');
      } else {
        selectedDays.add(day);
        chip.classList.add('active');
      }
    });
  });

  document.getElementById('edit-task-cancel').onclick = closeModal;
  document.getElementById('edit-task-confirm').onclick = async () => {
    const errEl = document.getElementById('edit-task-error');
    const confirmBtn = document.getElementById('edit-task-confirm');
    const newText = textInput.value.trim();
    const chosenFunc = funcSelect.value === '__new__' ? funcNewInput.value.trim() : funcSelect.value;

    if (!newText){
      errEl.textContent = 'Digite o texto da atividade.';
      errEl.classList.add('show');
      return;
    }
    if (!chosenFunc){
      errEl.textContent = 'Escolha ou digite um responsável.';
      errEl.classList.add('show');
      return;
    }

    errEl.classList.remove('show');
    confirmBtn.textContent = 'Salvando...';
    confirmBtn.disabled = true;

    editTask(appState, sala, func, text, chosenFunc, newText, Array.from(selectedDays));
    const ok = await saveState(appState);

    if (!ok){
      confirmBtn.textContent = 'Salvar alterações';
      confirmBtn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }

    closeModal();
    render();
  };
}

/**
 * Modo de cadastro rápido — ativado pelo link .../index.html?modo=cadastro
 * (pra usar num QR Code fixado na obra). Mostra só um formulário protegido
 * por PIN pra cadastrar uma atividade, sem o resto do dashboard.
 */
const urlParams = new URLSearchParams(window.location.search);
const isQuickAddMode = urlParams.get('modo') === 'cadastro';
const QUICK_ADD_PIN = "1303";
const QUICK_ADD_SESSION_KEY = 'fibonacci-checklist-quickadd-unlocked';

async function initQuickAddMode(){
  initTheme();
  document.body.innerHTML = `
    <div class="quick-wrap">
      <div class="quick-card">
        <div class="quick-logo"><img id="quick-logo-img" alt="Fibonacci Engenharia" /></div>
        <h1>Cadastro rápido de atividade</h1>
        <div id="quick-content"></div>
      </div>
    </div>
  `;
  document.getElementById('quick-logo-img').src = "data:image/png;base64," + LOGO_B64;

  let unlocked = false;
  try{ unlocked = sessionStorage.getItem(QUICK_ADD_SESSION_KEY) === 'yes'; }catch(e){}

  if (!unlocked){
    renderQuickPinGate();
  } else {
    await renderQuickForm();
  }
}

function renderQuickPinGate(){
  const el = document.getElementById('quick-content');
  el.innerHTML = `
    <p class="quick-sub">Digite o código de acesso pra cadastrar uma atividade.</p>
    <div class="modal-field">
      <input type="password" id="quick-pin-input" inputmode="numeric" placeholder="Código" />
    </div>
    <div class="modal-error" id="quick-pin-error"></div>
    <button class="quick-btn" id="quick-pin-confirm">Entrar</button>
  `;
  const input = document.getElementById('quick-pin-input');
  input.focus();
  const tryUnlock = async () => {
    if (input.value.trim() === QUICK_ADD_PIN){
      try{ sessionStorage.setItem(QUICK_ADD_SESSION_KEY, 'yes'); }catch(e){}
      await renderQuickForm();
    } else {
      const errEl = document.getElementById('quick-pin-error');
      errEl.textContent = 'Código incorreto.';
      errEl.classList.add('show');
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('quick-pin-confirm').onclick = tryUnlock;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
}

async function renderQuickForm(){
  const el = document.getElementById('quick-content');
  el.innerHTML = '<p class="quick-sub">Carregando...</p>';

  if (!appState){
    appState = await loadState();
  }

  const salas = Object.keys(appState.seed).filter(s => !appState.archived[s]);
  const employees = employeesFromSeed(appState.seed);

  const salaOptionsHtml = salas.map(s => `<option value="${s}">${s}</option>`).join('');
  const funcOptionsHtml = employees.map(e => `<option value="${e}">${e}</option>`).join('');
  const dayButtonsHtml = DAYS.map(({ code, label }) =>
    `<button type="button" class="modal-day-chip" data-day="${code}">${label}</button>`
  ).join('');

  el.innerHTML = `
    <p class="quick-sub">Preencha os dados da atividade.</p>
    <div class="modal-field">
      <label for="quick-text">Atividade</label>
      <input type="text" id="quick-text" placeholder="Ex: Instalar porta do banheiro" />
    </div>
    <div class="modal-field">
      <label for="quick-sala-select">Sala</label>
      <select id="quick-sala-select">
        ${salaOptionsHtml}
        <option value="__new__">Outro (nova sala)</option>
      </select>
    </div>
    <div class="modal-field" id="quick-sala-new-field" style="display:none;">
      <label for="quick-sala-new">Nome da nova sala</label>
      <input type="text" id="quick-sala-new" placeholder="Ex: Sala 1301" />
    </div>
    <div class="modal-field">
      <label for="quick-func-select">Responsável</label>
      <select id="quick-func-select">
        ${funcOptionsHtml}
        <option value="__new__">Outro (digitar nome novo)</option>
      </select>
    </div>
    <div class="modal-field" id="quick-func-new-field" style="display:none;">
      <label for="quick-func-new">Nome do novo responsável</label>
      <input type="text" id="quick-func-new" placeholder="Ex: Neto" />
    </div>
    <div class="modal-field">
      <label>Dias (opcional)</label>
      <div class="modal-days">${dayButtonsHtml}</div>
    </div>
    <div class="quick-hint">Atividades com "Comprar"/"Compra" no texto vão automaticamente pra aba Compras.</div>
    <div class="modal-error" id="quick-form-error"></div>
    <div class="quick-success" id="quick-form-success"></div>
    <button class="quick-btn" id="quick-form-confirm">Cadastrar atividade</button>
  `;

  const textInput = document.getElementById('quick-text');
  textInput.focus();

  const salaSelect = document.getElementById('quick-sala-select');
  const salaNewField = document.getElementById('quick-sala-new-field');
  salaSelect.addEventListener('change', () => {
    salaNewField.style.display = salaSelect.value === '__new__' ? 'block' : 'none';
  });

  const funcSelect = document.getElementById('quick-func-select');
  const funcNewField = document.getElementById('quick-func-new-field');
  funcSelect.addEventListener('change', () => {
    funcNewField.style.display = funcSelect.value === '__new__' ? 'block' : 'none';
  });

  const selectedDays = new Set();
  document.querySelectorAll('#quick-content .modal-day-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const day = chip.dataset.day;
      if (selectedDays.has(day)){ selectedDays.delete(day); chip.classList.remove('active'); }
      else { selectedDays.add(day); chip.classList.add('active'); }
    });
  });

  document.getElementById('quick-form-confirm').onclick = async () => {
    const errEl = document.getElementById('quick-form-error');
    const successEl = document.getElementById('quick-form-success');
    const confirmBtn = document.getElementById('quick-form-confirm');
    errEl.classList.remove('show');
    successEl.classList.remove('show');

    const text = textInput.value.trim();
    const sala = salaSelect.value === '__new__' ? document.getElementById('quick-sala-new').value.trim() : salaSelect.value;
    const func = funcSelect.value === '__new__' ? document.getElementById('quick-func-new').value.trim() : funcSelect.value;

    if (!text){ errEl.textContent = 'Digite o texto da atividade.'; errEl.classList.add('show'); return; }
    if (!sala){ errEl.textContent = 'Escolha ou digite uma sala.'; errEl.classList.add('show'); return; }
    if (!func){ errEl.textContent = 'Escolha ou digite um responsável.'; errEl.classList.add('show'); return; }

    confirmBtn.textContent = 'Salvando...';
    confirmBtn.disabled = true;

    const criouNovoAlgo = salaSelect.value === '__new__' || funcSelect.value === '__new__';
    addCustomTask(appState, sala, func, text, Array.from(selectedDays));
    const ok = await saveState(appState);

    if (!ok){
      confirmBtn.textContent = 'Cadastrar atividade';
      confirmBtn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }

    if (criouNovoAlgo){
      // recarrega o formulário pra incluir a sala/responsável recém-criados nas listas
      await renderQuickForm();
    } else {
      textInput.value = '';
      selectedDays.clear();
      document.querySelectorAll('#quick-content .modal-day-chip.active').forEach(chip => chip.classList.remove('active'));
      confirmBtn.textContent = 'Cadastrar atividade';
      confirmBtn.disabled = false;
      textInput.focus();
    }
    document.getElementById('quick-form-success').textContent = '✅ Atividade cadastrada!';
    document.getElementById('quick-form-success').classList.add('show');
  };
}

(async function init(){
  if (isQuickAddMode){
    await initQuickAddMode();
    return;
  }
  document.getElementById('footer').textContent = 'Carregando checklist salva...';
  appState = await loadState();
  render();
})();
</script>
</body>
</html>
